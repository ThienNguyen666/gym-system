services:
  db:
    image: postgres:18
    container_name: gym-db
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_pass
      POSTGRES_DB: gym
    ports:
      - "5432:5432"
    volumes:
      - gym_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym"]
      interval: 5s
      retries: 10

volumes:
  gym_pgdata: